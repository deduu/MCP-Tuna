# Codex CLI - ~/.codex/config.toml (or .codex/config.toml for project scope)
#
# Recommended default for Codex: start with the smallest useful MCP surface.
# Split servers keep tool count and context overhead lower than the unified
# gateway, which helps both routing quality and token efficiency.

[mcp_servers.mcp-tuna-data]
command = "mcp-tuna-data"

[mcp_servers.mcp-tuna-data.env]
OPENAI_API_KEY = "sk-..."

[mcp_servers.mcp-tuna-train]
command = "mcp-tuna-train"

[mcp_servers.mcp-tuna-train.env]
HF_TOKEN = "hf_..."

# Add more servers only when the task needs them.
# [mcp_servers.mcp-tuna-eval]
